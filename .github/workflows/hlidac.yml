name: Hlídač kurtů

on:
  schedule:
    - cron: "*/5 5-20 * * *"   # UTC; skript sám běží jen 7:00–21:00 pražského času (letní i zimní čas)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Prague
      HALLS: Sprint   # Paradise blokuje servery GitHubu (Cloudflare 403) – zatím vypnuto
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 hlidac.py
      - name: Uložit stav
        run: |
          git config user.name "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "stav $(date '+%d.%m. %H:%M')" && git push)
