name: Hlídač kurtů

# Plánovač GitHubu (cron) u bezplatných repozitářů spouští běhy se zpožděním i několik hodin,
# proto jeden běh kontroluje ve smyčce každé ~4 min a po ~5,5 h spustí svého nástupce (workflow_dispatch
# se spouští hned). Cron níže je jen záchrana, kdyby se řetěz přerušil; souběžný běh je vždy max. jeden.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Europe/Prague
      HALLS: Sprint   # Paradise blokuje servery GitHubu (Cloudflare 403) – zatím vypnuto
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: Hlídat (smyčka ~5,5 h)
        run: |
          git config user.name "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python3 hlidac.py || true
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -qm "stav $(date '+%d.%m. %H:%M')"
              git push -q || (git pull -q --rebase && git push -q) || true
            fi
            sleep 240
          done
      - name: Spustit dalšího hlídače
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hlidac.yml --ref main
